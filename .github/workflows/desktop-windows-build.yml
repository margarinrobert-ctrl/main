name: Build Trading Backtester (Windows)

# Produces TradingBacktesterSetup.exe as a downloadable artifact.
#
# A Windows executable cannot be cross-compiled from Linux -- PyInstaller freezes
# the interpreter it is running on -- so the installer is built here, on a real
# windows-latest runner, and attached to the run.

on:
  push:
    branches: ["**"]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-windows-build.yml"
  workflow_dispatch:
  release:
    types: [published]

# `contents: write` is what lets the build republish the rolling release below.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: desktop/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest

      - name: Run the test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q

      - name: Generate the application icon
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "from PySide6.QtWidgets import QApplication; app=QApplication([]); from tradingbacktester.ui.icons import save_app_icon_ico; save_app_icon_ico('assets/app.ico'); print('icon written')"

      # Stamp the build so the app shows which one it is (title bar, About)
      # and the installer carries the same version.
      - name: Stamp the build number
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          $date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd")
          $lines = @(
            '"""Which build this is. Written by the Windows build; do not edit."""',
            "BUILD_NUMBER = ${{ github.run_number }}",
            "COMMIT = `"$sha`"",
            "BUILD_DATE = `"$date`""
          )
          Set-Content -Path "tradingbacktester\_build_info.py" -Value ($lines -join "`n") -Encoding utf8
          Get-Content "tradingbacktester\_build_info.py"
          python -c "from tradingbacktester.config import APP_VERSION, APP_BUILD; print(APP_VERSION, APP_BUILD)"

      - name: Build the application with PyInstaller
        run: python -m PyInstaller packaging/TradingBacktester.spec --noconfirm --clean

      - name: Self-test the frozen build
        run: |
          $p = Start-Process -FilePath "dist\TradingBacktester\TradingBacktester.exe" -ArgumentList "--self-test" -PassThru -Wait -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "Frozen build failed its self-test (exit $($p.ExitCode))" }

      # `--self-test` forces the offscreen platform, so it proves the packaging
      # and the Python path and says nothing about the window system. This runs
      # the exe on whatever platform plugin the runner actually has, which is
      # the path a "white screen" report lives in. Non-blocking on purpose: a
      # runner without an interactive desktop is not a broken application, and
      # the breadcrumbs printed afterwards are the point either way.
      - name: Smoke-test the frozen build on the real display
        continue-on-error: true
        timeout-minutes: 3
        run: |
          $p = Start-Process -FilePath "dist\TradingBacktester\TradingBacktester.exe" -ArgumentList "--smoke-test" -PassThru -Wait -NoNewWindow
          Write-Host "smoke-test exit code: $($p.ExitCode)"
          $crumbs = Join-Path $env:LOCALAPPDATA "TradingBacktester\startup.log"
          if (Test-Path $crumbs) {
            Write-Host "--- start-up breadcrumbs ---"
            Get-Content $crumbs | Select-Object -Last 30
          } else {
            Write-Host "no breadcrumb file at $crumbs"
          }
          if ($p.ExitCode -ne 0) { throw "the window never painted (exit $($p.ExitCode))" }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=1.0.${{ github.run_number }}" packaging\installer.iss
          if (-not (Test-Path "dist\TradingBacktesterSetup.exe")) {
            throw "Inno Setup did not produce dist\TradingBacktesterSetup.exe"
          }
          $size = [math]::Round((Get-Item "dist\TradingBacktesterSetup.exe").Length / 1MB, 1)
          Write-Host "TradingBacktesterSetup.exe is $size MB"
          # The in-app updater must recognise this installer as its own, or
          # Help > Update from a Downloaded File would refuse the very file the
          # release offers. Blocking: better no release than that one.
          python -c "from tradingbacktester.updater import inspect_update as i; u = i('dist/TradingBacktesterSetup.exe'); print(u); raise SystemExit(0 if u.ok else 1)"
          if ($LASTEXITCODE -ne 0) { throw "the updater does not recognise the installer it ships with" }

      # The in-app updater, for real, on Windows PowerShell 5.1 (what every
      # Windows machine has): install this build, then upgrade that copy IN
      # PLACE with the updater's own script; then the same for a portable copy
      # from the zip. Non-blocking so a problem here cannot hold back a
      # release, but its log is read after every build.
      - name: Test updating in place (installed and portable)
        continue-on-error: true
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = "Stop"
          $t = $env:RUNNER_TEMP

          # -- installed copy, upgraded with the installer ------------------
          $dir = Join-Path $t "tb-installed"
          $p = Start-Process -FilePath "dist\TradingBacktesterSetup.exe" -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$dir`"") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "first install failed: exit $($p.ExitCode)" }
          if (-not (Test-Path "$dir\unins000.exe")) { throw "no uninstaller after the first install" }
          (Get-Item "$dir\TradingBacktester.exe").LastWriteTime = [datetime]"2000-01-01"
          $log = Join-Path $t "update-installed.log"
          python packaging\ci_update_script.py "dist\TradingBacktesterSetup.exe" "$dir" "$log" "$t\apply-installed.ps1"
          if ($LASTEXITCODE -ne 0) { throw "the updater refused the installer" }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$t\apply-installed.ps1"
          Get-Content $log
          if (-not (Select-String -Path $log -Pattern "update installed" -Quiet)) { throw "installed-copy update did not report success" }
          if ((Get-Item "$dir\TradingBacktester.exe").LastWriteTime -le [datetime]"2000-01-02") { throw "the installer did not replace the program" }
          if (-not (Test-Path "$dir\unins000.exe")) { throw "the upgrade lost the uninstaller" }
          $p = Start-Process -FilePath "$dir\TradingBacktester.exe" -ArgumentList "--self-test" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "the upgraded copy failed its self-test" }
          Write-Host "installed copy: upgraded in place and self-tested"

          # -- portable copy, upgraded with the zip --------------------------
          Compress-Archive -Path "dist\TradingBacktester" -DestinationPath "$t\portable.zip" -Force
          $pdir = Join-Path $t "tb-portable\TradingBacktester"
          New-Item -ItemType Directory -Path (Split-Path $pdir) -Force | Out-Null
          Copy-Item -Path "dist\TradingBacktester" -Destination $pdir -Recurse
          Set-Content -Path "$pdir\stale-from-old-version.txt" -Value "old"
          $log = Join-Path $t "update-portable.log"
          python packaging\ci_update_script.py "$t\portable.zip" "$pdir" "$log" "$t\apply-portable.ps1"
          if ($LASTEXITCODE -ne 0) { throw "the updater refused the portable zip" }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$t\apply-portable.ps1"
          Get-Content $log
          if (-not (Select-String -Path $log -Pattern "update installed" -Quiet)) { throw "portable update did not report success" }
          if (Test-Path "$pdir\stale-from-old-version.txt") { throw "the portable update mixed old and new files" }
          $p = Start-Process -FilePath "$pdir\TradingBacktester.exe" -ArgumentList "--self-test" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "the updated portable copy failed its self-test" }
          Write-Host "portable copy: swapped in place and self-tested"

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: TradingBacktesterSetup
          path: desktop/dist/TradingBacktesterSetup.exe
          if-no-files-found: error
          retention-days: 90

      - name: Upload the unpacked application
        uses: actions/upload-artifact@v4
        with:
          name: TradingBacktester-portable
          path: desktop/dist/TradingBacktester/
          if-no-files-found: error
          retention-days: 30

      # A run artifact is only downloadable by someone SIGNED IN to GitHub, and
      # only as a zip of a zip. Reported as "i cant dowload it", with a run page
      # whose artifact names rendered as plain text and a GitHub header offering
      # "Sign in" -- the signed-out view.
      #
      # A release asset has none of that: a stable public URL, no account, the
      # real file. So every green build also republishes one rolling release,
      # and these two links always serve the newest build:
      #
      #   .../releases/latest/download/TradingBacktesterSetup.exe
      #   .../releases/latest/download/TradingBacktester-portable.zip
      #
      # gh ships on the runner, so this needs no third-party action. It runs
      # last, after the artifact uploads, so a failure here can never cost us
      # the artifacts. And a release published with GITHUB_TOKEN does not
      # trigger workflows, so this cannot re-trigger the `release` event above.
      - name: Publish the build as a downloadable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub sets $ErrorActionPreference to Stop for pwsh steps. From
          # PowerShell 7.4 that can ALSO make a native command's non-zero exit a
          # terminating error, depending on the runner's version. Pin it off so
          # the behaviour does not depend on which pwsh the runner ships, and
          # check $LASTEXITCODE explicitly instead -- every gh call below does.
          $PSNativeCommandUseErrorActionPreference = $false

          # The folder itself, not its contents, so it unzips into
          # TradingBacktester\ rather than scattering files where it lands.
          Compress-Archive -Path "dist\TradingBacktester" `
                           -DestinationPath "dist\TradingBacktester-portable.zip" -Force

          $tag     = "desktop-latest"
          $short   = "${{ github.sha }}".Substring(0, 7)
          $subject = git log -1 --pretty=%s "${{ github.sha }}"
          $built   = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd HH:mm")
          $repo    = "${{ github.repository }}"
          $run     = "${{ github.server_url }}/$repo/actions/runs/${{ github.run_id }}"

          # An array joined by newlines, not a here-string: a here-string
          # terminator has to sit in column 1, which YAML block indentation
          # makes into a trap. `` is an escaped backtick, so it renders as the
          # single backtick markdown wants around inline code.
          $notes = @(
            "The Windows build of the Trading Backtester, rebuilt on every change.",
            "",
            "**[Download the installer](https://github.com/$repo/releases/latest/download/TradingBacktesterSetup.exe)** -- run it and the application installs.",
            "",
            "**[Download the portable build](https://github.com/$repo/releases/latest/download/TradingBacktester-portable.zip)** -- no installation; unzip it and run ``TradingBacktester.exe``.",
            "",
            "Neither link needs a GitHub account.",
            "",
            "---",
            "",
            "Built $built UTC from [run ${{ github.run_id }}]($run), commit ``$short`` on ``${{ github.ref_name }}``:",
            "",
            "> $subject",
            "",
            "The test suite, the frozen build's self-test and the installer step all passed before this was published.",
            "",
            "This release is replaced by the next build, so the links above always point at the newest one."
          ) -join "`n"

          # `gh release list` succeeds with empty output when there is nothing,
          # so the probe never has to fail on the very first run.
          $existing = gh release list --json tagName --jq ".[].tagName"
          if ($LASTEXITCODE -ne 0) { throw "gh release list failed (exit $LASTEXITCODE)" }

          if ($existing -contains $tag) {
            # A rolling tag has to be recreated: `gh release edit --target` is
            # ignored once the tag exists.
            Write-Host "replacing the existing $tag release"
            gh release delete $tag --yes --cleanup-tag
            if ($LASTEXITCODE -ne 0) { throw "could not delete the existing $tag release (exit $LASTEXITCODE)" }
            Start-Sleep -Seconds 5
          } else {
            Write-Host "no $tag release yet; creating it"
          }

          # Deleting a tag and recreating it in the same second occasionally
          # races on GitHub's side, and a failure here is exactly the download
          # link the user cannot get. Give it three tries.
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            gh release create $tag `
              "dist\TradingBacktesterSetup.exe#Installer for Windows" `
              "dist\TradingBacktester-portable.zip#Portable build, no installation" `
              --target "${{ github.sha }}" `
              --title "Trading Backtester - latest Windows build" `
              --notes $notes `
              --latest
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { throw "gh release create failed three times (exit $LASTEXITCODE)" }
            Write-Host "attempt $attempt failed (exit $LASTEXITCODE); retrying"
            Start-Sleep -Seconds 10
          }

          Write-Host "published ${{ github.server_url }}/$repo/releases/tag/$tag"
